name: mobile-ci

on:
  push:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run verify
